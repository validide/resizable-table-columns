name: Node.js Package

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
      packages: write # GitHub Packages
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          registry-url: https://registry.npmjs.org/
          scope: '@validide'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build

      - name: Set version from release tag
        run: pnpm version --no-git-tag-version "${RELEASE_TAG#v}"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}

      - name: Publish to GitHub Packages
        run: |
          npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          npm publish --access public --@validide:registry=https://npm.pkg.github.com/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
